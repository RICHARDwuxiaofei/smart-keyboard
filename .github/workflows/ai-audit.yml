name: AI audit validation

on:
  push:
    branches: [audit/ai-pipeline-20260909]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify clean source and collect history
        shell: bash
        run: |
          set -euo pipefail
          git status
          test -z "$(git status --porcelain)"
          git log --oneline -10 | tee "$RUNNER_TEMP/git-log.txt"
          git rev-parse HEAD | tee "$RUNNER_TEMP/source-sha.txt"
          git bundle create "$RUNNER_TEMP/source.bundle" --all
          python .github/audit-staging/prepare.py
          git diff --stat | tee "$RUNNER_TEMP/candidate-stat.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audit-source-${{ github.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/git-log.txt
            ${{ runner.temp }}/reviewed-candidate.patch
            ${{ runner.temp }}/candidate-stat.txt
            .github/audit-staging/followup.patch

  jvm-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python .github/audit-staging/prepare.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Kotlin compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 'https://github.com/JetBrains/kotlin/releases/download/v2.3.21/kotlin-compiler-2.3.21.zip' -o "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/compiler"
          echo "$RUNNER_TEMP/compiler/kotlinc/bin" >> "$GITHUB_PATH"
          echo "KOTLIN_HOME=$RUNNER_TEMP/compiler/kotlinc" >> "$GITHUB_ENV"
      - name: Host production logic and SQLite checks
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ai-audit/run-host.sh "$RUNNER_TEMP/host-results"
          python tools/ai-audit/sqlite-regression.py | tee "$RUNNER_TEMP/host-results/sqlite-regression.log"
      - name: Real HTTP and JSON library regression tests
        shell: bash
        run: bash tools/ai-audit/run-network-tests.sh "$RUNNER_TEMP/network-results"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audit-jvm-evidence-${{ github.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/host-results/*.log
            ${{ runner.temp }}/network-results/*.log

  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify clean checkout and apply reviewed candidate
        run: |
          git status
          git log --oneline -10
          test -z "$(git status --porcelain)"
          python .github/audit-staging/prepare.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install declared SDK and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.1.0' 'cmake;3.31.6' 'ndk;28.0.13004108'
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules gettext
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Compile debug Kotlin
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:compileDebugKotlin --stacktrace 2>&1 | tee "$RUNNER_TEMP/compile-debug.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audit-compile-${{ github.sha }}
          retention-days: 7
          path: ${{ runner.temp }}/compile-debug.log
      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/assemble-debug.log"
      - name: Run debug unit tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"
      - name: Compile Android instrumentation tests
        id: instrumentation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/instrumentation-build.log"
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audit-debug-evidence-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/compile-debug.log
            ${{ runner.temp }}/assemble-debug.log
            ${{ runner.temp }}/unit-tests.log
            ${{ runner.temp }}/instrumentation-build.log
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/debug/
            app/build/outputs/apk/androidTest/
      - name: Require all validation steps to pass
        if: always()
        shell: bash
        env:
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          ASSEMBLE_RESULT: ${{ steps.assemble.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          INSTRUMENTATION_RESULT: ${{ steps.instrumentation.outcome }}
        run: |
          printf 'compile=%s assemble=%s tests=%s instrumentation-build=%s\n' "$COMPILE_RESULT" "$ASSEMBLE_RESULT" "$TEST_RESULT" "$INSTRUMENTATION_RESULT"
          test "$COMPILE_RESULT" = success
          test "$ASSEMBLE_RESULT" = success
          test "$TEST_RESULT" = success
          test "$INSTRUMENTATION_RESULT" = success

  emulator-regression:
    needs: android-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v7
        with:
          name: audit-debug-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android Room, editor, native Pinyin and OCR tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash .github/audit-staging/run-device-tests.sh "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/runtime"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audit-runtime-evidence-${{ github.sha }}
          retention-days: 7
          path: ${{ runner.temp }}/runtime/
